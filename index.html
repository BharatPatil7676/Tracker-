<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bharat Patil— Habit Tracker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08070c;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.page{
  max-width:1200px;
  margin:auto;
  padding:28px;
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

h1{
  font-size:34px;
  margin:0 0 5px;
}

.sub{
  color:#9995a2;
}

.controls{
  display:flex;
  gap:8px;
}

button{
  border:1px solid #403a4d;
  background:#18151f;
  color:#fff;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer;
}

button:hover{
  background:#24202d;
}

.primary{
  background:#7049e5;
  border-color:#8b68ee;
}

/* STATISTICS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#15131b;
  border:1px solid #332e3c;
  border-radius:9px;
  padding:16px;
}

.label{
  color:#aaa5b2;
  font-size:12px;
  margin-bottom:10px;
}

.value{
  font-size:24px;
  font-weight:bold;
}

.bar{
  height:14px;
  border:2px solid #d06c5e;
  padding:2px;
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:#d87562;
  transition:.3s;
}

/* HABIT TABLE */

.sheet{
  overflow:auto;
  background:#0f0e14;
  border:1px solid #342f3d;
  border-radius:9px;
}

.grid{
  display:grid;
  grid-template-columns:190px repeat(28,36px);
  min-width:1200px;
}

.cell{
  height:43px;
  border-right:1px solid #302c39;
  border-bottom:1px solid #302c39;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}

.name{
  justify-content:flex-start;
  padding:0 12px;
  font-weight:bold;
  background:#121017;
  position:sticky;
  left:0;
  z-index:2;
}

.month{
  font-size:20px;
  font-weight:bold;
  justify-content:flex-start;
  padding-left:14px;
  background:#17141d;
}

/* WEEK COLORS */

.w1{
  background:#39258b;
}

.w2{
  background:#3d7893;
}

.w3{
  background:#62a5a7;
}

.w4{
  background:#a83e76;
}

/* CHECKBOX */

.check{
  width:21px;
  height:21px;
  padding:0;
  border:2px solid #666073;
  border-radius:4px;
  background:#15131b;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:14px;
}

.check:hover{
  background:#292431;
}

.check.done{
  background:#7952df;
  border-color:#a181f2;
}

/* LEGEND */

.legend{
  padding:14px;
  display:flex;
  gap:18px;
  color:#aaa5b2;
  font-size:12px;
}

.legend span{
  display:flex;
  gap:6px;
  align-items:center;
}

.dot{
  width:13px;
  height:13px;
  border-radius:3px;
}

/* BOTTOM CARDS */

.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:18px;
}

.card{
  background:#15131b;
  border:1px solid #332e3c;
  border-radius:9px;
  padding:18px;
}

.card h2{
  margin:0 0 15px;
}

/* ADD HABIT */

.form{
  display:flex;
  gap:8px;
}

.form input{
  flex:1;
  min-width:0;

  background:#0c0b10;
  border:1px solid #3b3546;

  color:#fff;

  padding:11px;

  border-radius:7px;
}

.form input:focus{
  outline:none;
  border-color:#7952df;
}

/* HABIT LIST */

.list{
  margin-top:14px;
  display:grid;
  gap:7px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px;

  background:#0d0c11;
  border:1px solid #302c39;

  border-radius:7px;
}

.delete{
  background:none;
  border:0;
  color:#ff8b82;
  padding:2px;
}

.delete:hover{
  background:#28151a;
}

/* DAILY CHART */

.chart{
  height:170px;

  display:flex;
  align-items:flex-end;

  gap:5px;
}

.cbar{
  flex:1;

  background:#7350db;

  border-radius:4px 4px 0 0;

  min-height:3px;

  transition:.3s;
}

.labels{
  display:flex;
  gap:5px;
}

.labels span{
  flex:1;
  text-align:center;
  color:#77727e;
  font-size:8px;
}

/* MOBILE */

@media(max-width:700px){

  .page{
    padding:15px;
  }

  header{
    display:block;
  }

  .controls{
    margin-top:14px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .bottom{
    grid-template-columns:1fr;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>


<body>

<div class="page">

<!-- HEADER -->

<header>

  <div>
    <h1>February</h1>
    <div class="sub">• Habit tracker •</div>
  </div>

  <div class="controls">

    <button onclick="resetAll()">
      Reset
    </button>

    <button class="primary" onclick="addHabit()">
      + Add habit
    </button>

  </div>

</header>


<!-- STATISTICS -->

<div class="stats">

  <div class="stat">

    <div class="label">
      Number of habits
    </div>

    <div class="value" id="hc">
      10
    </div>

  </div>


  <div class="stat">

    <div class="label">
      Completed habits
    </div>

    <div class="value" id="done">
      0
    </div>

  </div>


  <div class="stat">

    <div class="label">
      Completion rate
    </div>

    <div class="value" id="rate">
      0%
    </div>

  </div>


  <div class="stat">

    <div class="label">
      Progress
    </div>

    <div class="bar">

      <i id="pb"></i>

    </div>

  </div>

</div>


<!-- HABIT TRACKER -->

<section class="sheet">

  <div class="grid" id="head"></div>

  <div class="grid" id="body"></div>


  <div class="legend">

    <span>
      <i class="dot w1"></i>
      Week 1
    </span>

    <span>
      <i class="dot w2"></i>
      Week 2
    </span>

    <span>
      <i class="dot w3"></i>
      Week 3
    </span>

    <span>
      <i class="dot w4"></i>
      Week 4
    </span>

  </div>

</section>


<!-- BOTTOM -->

<div class="bottom">


  <!-- MY HABITS -->

  <section class="card">

    <h2>
      My Habits
    </h2>


    <div class="form">

      <input
        id="new"
        placeholder="Enter a new habit"
      >

      <button
        class="primary"
        onclick="addHabit()"
      >
        Add
      </button>

    </div>


    <div
      class="list"
      id="list"
    ></div>

  </section>



  <!-- DAILY PROGRESS -->

  <section class="card">

    <h2>
      Daily Progress
    </h2>


    <div
      class="chart"
      id="chart"
    ></div>


    <div
      class="labels"
      id="labels"
    ></div>

  </section>


</div>

</div>


<script>

/* =========================================
   DEFAULT HABITS
========================================= */

let habits =
JSON.parse(localStorage.getItem("habits")) ||
[
  "Get up early",
  "Gym / exercise",
  "Study / work",
  "Read 10 pages",
  "Drink enough water",
  "No junk food",
  "No social media",
  "Meditation",
  "Sleep 7–8 hours",
  "Cold shower"
];


/* =========================================
   SAVED CHECKBOXES
========================================= */

let checks =
JSON.parse(localStorage.getItem("checks")) || {};


const DAYS = 28;


/* =========================================
   CHECKBOX KEY
========================================= */

function key(index,day){

  return index + "_" + day;

}


/* =========================================
   SAVE DATA
========================================= */

function save(){

  localStorage.setItem(
    "habits",
    JSON.stringify(habits)
  );

  localStorage.setItem(
    "checks",
    JSON.stringify(checks)
  );

}


/* =========================================
   WEEK COLOR
========================================= */

function weekClass(day){

  if(day <= 7){

    return "w1";

  }

  if(day <= 14){

    return "w2";

  }

  if(day <= 21){

    return "w3";

  }

  return "w4";

}


/* =========================================
   RENDER EVERYTHING
========================================= */

function render(){


  /* TOTAL HABITS */

  document.getElementById("hc")
    .textContent = habits.length;


  /* COMPLETED */

  let total =
    habits.length * DAYS;


  let completed =
    Object.values(checks)
    .filter(Boolean)
    .length;


  /* RATE */

  let rate =
    total
    ? Math.round(
        completed / total * 100
      )
    : 0;


  document.getElementById("done")
    .textContent = completed;


  document.getElementById("rate")
    .textContent = rate + "%";


  document.getElementById("pb")
    .style.width = rate + "%";


  /* =====================================
     DAY HEADER
  ===================================== */

  let header =
    '<div class="cell month">February</div>';


  for(
    let day = 1;
    day <= DAYS;
    day++
  ){

    header +=
      `<div class="cell ${weekClass(day)}">
        ${day}
      </div>`;

  }


  document.getElementById("head")
    .innerHTML = header;



  /* =====================================
     HABIT GRID
  ===================================== */

  let body = "";


  habits.forEach(
    (habit,index)=>{


      body +=
        `<div class="cell name">
          ${escapeHTML(habit)}
        </div>`;


      for(
        let day = 1;
        day <= DAYS;
        day++
      ){

        let k =
          key(index,day);


        body +=
          `<div class="cell">

            <button
              class="check ${checks[k] ? "done" : ""}"
              onclick="toggle(${index},${day})"
            >
              ${checks[k] ? "✓" : ""}
            </button>

          </div>`;

      }

    }
  );


  document.getElementById("body")
    .innerHTML = body;



  /* =====================================
     HABIT LIST
  ===================================== */

  document.getElementById("list")
    .innerHTML = habits.map(
      (habit,index)=>`

        <div class="row">

          <span>
            ${escapeHTML(habit)}
          </span>

          <button
            class="delete"
            onclick="deleteHabit(${index})"
          >
            Delete
          </button>

        </div>

      `
    ).join("");



  /* =====================================
     DAILY CHART
  ===================================== */

  let chart = "";
  let labels = "";


  for(
    let day = 1;
    day <= DAYS;
    day++
  ){

    let completedToday =
      habits.reduce(
        (sum,habit,index)=>{

          return sum +
            (
              checks[key(index,day)]
              ? 1
              : 0
            );

        },
        0
      );


    let height =
      habits.length
      ? Math.max(
          3,
          completedToday /
          habits.length *
          150
        )
      : 3;


    chart +=
      `<div
        class="cbar"
        style="height:${height}px"
      ></div>`;


    labels +=
      `<span>${day}</span>`;

  }


  document.getElementById("chart")
    .innerHTML = chart;


  document.getElementById("labels")
    .innerHTML = labels;

}


/* =========================================
   TOGGLE CHECKBOX
========================================= */

function toggle(index,day){

  let k =
    key(index,day);


  checks[k] =
    !checks[k];


  save();

  render();

}


/* =========================================
   ADD HABIT
========================================= */

function addHabit(){

  let input =
    document.getElementById("new");


  let name =
    input.value.trim();


  if(!name){

    input.focus();

    return;

  }


  habits.push(name);


  input.value = "";


  save();

  render();

}


/* =========================================
   DELETE HABIT
========================================= */

function deleteHabit(index){

  if(
    !confirm(
      "Delete this habit?"
    )
  ){

    return;

  }


  let newChecks = {};


  Object.keys(checks)
    .forEach(k=>{

      let parts =
        k.split("_");


      let habitIndex =
        Number(parts[0]);


      let day =
        Number(parts[1]);


      if(
        habitIndex !== index
      ){

        let newIndex =
          habitIndex > index
          ? habitIndex - 1
          : habitIndex;


        newChecks[
          newIndex + "_" + day
        ] =
          checks[k];

      }

    });


  habits.splice(index,1);


  checks =
    newChecks;


  save();

  render();

}


/* =========================================
   RESET
========================================= */

function resetAll(){

  if(
    !confirm(
      "Clear all checkmarks?"
    )
  ){

    return;

  }


  checks = {};


  save();

  render();

}


/* =========================================
   SECURITY / TEXT CLEANING
========================================= */

function escapeHTML(text){

  return String(text)
    .replace(
      /[&<>"']/g,
      function(character){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[character];

      }
    );

}


/* =========================================
   START WEBSITE
========================================= */

render();

</script>

</body>
</html>
